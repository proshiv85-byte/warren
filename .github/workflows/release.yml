# Builds everything and creates a DRAFT release on GitHub.
#
# To release: bump `version` in main.go (and mod_version in
# minecraft/gradle.properties if the mod changed), write
# .github/release-notes/vX.Y.Z.md, merge to main, then on GitHub go to
# Actions -> Release -> Run workflow. Check the draft on the Releases page
# and press "Publish release". Until then nobody sees it: warren update and
# setup.sh only use published releases.

name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, to check this version isn't released yet

      - name: Work out the version
        id: ver
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this from the main branch (you picked $GITHUB_REF_NAME)."
            exit 1
          fi
          version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)
          if [ -z "$version" ]; then
            echo "::error::Could not find 'var version = \"...\"' in main.go."
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version is already released. Raise the version in main.go first."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing warren $version"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: go test -race -count=1 ./...

      - name: Build warren for every platform
        run: make dist

      - name: Build the Minecraft mod
        working-directory: minecraft
        run: ./gradlew build --no-daemon

      - name: Collect the release files and checksums
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' minecraft/gradle.properties)
          mod=$(sed -n 's/^mod_version=//p' minecraft/gradle.properties)
          cp "minecraft/build/libs/warren-$mod.jar" "dist/warren-mod-$mod+mc$mc.jar"
          cp setup.sh dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          notes=".github/release-notes/v$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            echo "::warning::No $notes, so GitHub writes the notes from the merged PRs."
            set -- --generate-notes
          fi
          gh release create "v$VERSION" dist/* --draft --target "$GITHUB_SHA" \
            --title "warren $VERSION" "$@"
          echo "Draft created. Open the Releases page, check it, and press Publish release." >> "$GITHUB_STEP_SUMMARY"
